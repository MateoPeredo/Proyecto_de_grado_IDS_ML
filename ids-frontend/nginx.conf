server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tamaño máximo de subida (modelos .pkl pueden pesar >100 MB)
    client_max_body_size 250M;
    client_body_timeout 300s;

    # Compresión para los assets estáticos
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Cache agresiva para assets versionados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # ── Proxy REST → backend FastAPI ────────────────────────────────────────────
    # Usar proxy_pass con VARIABLE + resolver hace que Nginx NO resuelva el host
    # al arrancar, sino en cada petición. Así el contenedor levanta aunque el
    # backend todavía no exista (solo dará 502 si pegás a /api sin backend).
    # 127.0.0.11 es el DNS interno de Docker.
    location ~ ^/api/(.*)$ {
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/$1$is_args$args;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Subidas grandes (modelos .pkl): no bufferear todo el body
        # antes de mandarlo al backend, y dar margen de tiempo.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # ── Proxy WebSocket → backend FastAPI ────────────────────────────────────────
    location ~ ^/ws/(.*)$ {
        resolver 127.0.0.11 valid=10s;
        set $ws_upstream backend:8000;
        proxy_pass http://$ws_upstream/ws/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }
}