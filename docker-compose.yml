# ── Plantillas para los sensores (anchors YAML) ─────────────────
# Evitan repetir la config común de los 6 sensores.
x-sensor-base: &sensor-base
  build:
    context: ./ids-backend
    dockerfile: Dockerfile
  image: ids-backend            
  network_mode: host            # acceso directo a las interfaces del host
  cap_add:
    - NET_ADMIN
    - NET_RAW
  env_file:
    - path: ./ids-backend/.env
      required: false
  volumes:
    - models-data:/app/app/ml/modelos
  # Los sensores NO corren la API (corren el motor de captura), así que el
  # healthcheck del Dockerfile (curl a /health) no aplica y los marcaría
  # "unhealthy" sin motivo. Se desactiva para que el estado sea correcto.
  healthcheck:
    disable: true
  profiles: ["sensor"]
  restart: "no"

x-sensor-env: &sensor-env
  TZ: America/La_Paz
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: "3306"
  MYSQL_USER: ids
  MYSQL_PASSWORD: ids_pass
  MYSQL_DB: ids
  CLICKHOUSE_HOST: 127.0.0.1
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_USER: ids
  CLICKHOUSE_PASSWORD: ids_pass
  CLICKHOUSE_DB: ids_metrics
  ELASTIC_HOST: http://127.0.0.1:9200
  MODELS_DIR: /app/app/ml/modelos
  NOTIF_VENTANA_MIN: ${NOTIF_VENTANA_MIN:-15}

services:
  # ── Frontend (React/Vite + Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: ./ids-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /ws/live
    container_name: ids-frontend
    ports:
      - "8080:80"
    volumes:
      - ./ids-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - ids-net

  # ── Backend (FastAPI + ML) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./ids-backend
      dockerfile: Dockerfile
    container_name: ids-backend
    expose:
      - "8000"
    env_file:
      - path: ./ids-backend/.env
        required: false
    environment:
      TZ: America/La_Paz
      MYSQL_HOST: mysql
      MYSQL_USER: ids
      MYSQL_PASSWORD: ids_pass
      MYSQL_DB: ids
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: ids_metrics
      ELASTIC_HOST: http://elasticsearch:9200
      # Carpeta de modelos ML (persistida en volumen, compartida con el sensor)
      MODELS_DIR: /app/app/ml/modelos
    volumes:
      # MISMO volumen que el sensor: el modelo subido desde la web llega al
      # sensor y NO se pierde en rebuild (--no-cache). Antes faltaba este mount,
      # así el .pkl quedaba dentro del contenedor y nunca llegaba al sensor.
      - models-data:/app/app/ml/modelos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - ids-net

  # ── MySQL (datos transaccionales: usuarios, reglas) ──────────────────────────
  mysql:
    image: mysql:8.4
    container_name: ids-mysql
    environment:
      TZ: America/La_Paz
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ids
      MYSQL_USER: ids
      MYSQL_PASSWORD: ids_pass
    # Se expone el puerto al host (127.0.0.1) para que el sensor del IDS,
    # que corre en network_mode: host, pueda escribir las alertas.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uids", "-pids_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ids-net

  # ── ClickHouse (series temporales para los gráficos) ─────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ids-clickhouse
    environment:
      CLICKHOUSE_USER: ids
      CLICKHOUSE_PASSWORD: ids_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    # Se expone el puerto HTTP al host para que el sensor (network_mode: host)
    # pueda escribir el tráfico capturado en traffic_raw.
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-config/max_parts.xml:/etc/clickhouse-server/config.d/max_parts.xml:ro
    restart: unless-stopped
    networks:
      - ids-net

  # ── Elasticsearch (logs, captura de tráfico, alertas) ────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ids-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"        # sin auth para entorno de desarrollo
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"       # límite de RAM para la JVM
    # Se expone el puerto al host para que el sensor (network_mode: host)
    # pueda escribir los logs de detección y tráfico.
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - ids-net

  # ════════════════════════════════════════════════════════════════════════════
  #  SENSORES POR SEGMENTO (multi-sensor)
  #
  #  Cada uno vigila el bridge de un segmento del lab y etiqueta sus alertas y
  #  tráfico con su segmento (IDS_SEGMENTO). Comparten el perfil "sensor", así
  #  que se prenden/apagan a propósito, no arrancan solos.
  #
  #    Prender todos:  docker compose --profile sensor up -d
  #    Prender uno:    docker compose --profile sensor up -d sensor-produccion
  #    Apagar uno:     docker compose stop sensor-produccion
  #    Estado:         docker compose ps | grep sensor
  # ════════════════════════════════════════════════════════════════════════════
  sensor-datos:
    <<: *sensor-base
    container_name: ids-sensor-datos
    environment:
      <<: *sensor-env
      IDS_INTERFAZ: br-datos
      IDS_SEGMENTO: datos
    command: ["python", "-m", "app.engine.motor", "--interfaz", "br-datos"]

  sensor-contable:
    <<: *sensor-base
    container_name: ids-sensor-contable
    environment:
      <<: *sensor-env
      IDS_INTERFAZ: br-contable
      IDS_SEGMENTO: contable
    command: ["python", "-m", "app.engine.motor", "--interfaz", "br-contable"]

  sensor-wifi:
    <<: *sensor-base
    container_name: ids-sensor-wifi
    environment:
      <<: *sensor-env
      IDS_INTERFAZ: br-wifi
      IDS_SEGMENTO: wifi
    command: ["python", "-m", "app.engine.motor", "--interfaz", "br-wifi"]

  sensor-produccion:
    <<: *sensor-base
    container_name: ids-sensor-produccion
    environment:
      <<: *sensor-env
      IDS_INTERFAZ: br-dmz
      IDS_SEGMENTO: dmz
    command: ["python", "-m", "app.engine.motor", "--interfaz", "br-dmz"]

  sensor-prodv2:
    <<: *sensor-base
    container_name: ids-sensor-prodv2
    environment:
      <<: *sensor-env
      IDS_INTERFAZ: br-prodv2
      IDS_SEGMENTO: prodv2
    command: ["python", "-m", "app.engine.motor", "--interfaz", "br-prodv2"]

  sensor-riesgos:
    <<: *sensor-base
    container_name: ids-sensor-riesgos
    environment:
      <<: *sensor-env
      IDS_INTERFAZ: br-riesgos
      IDS_SEGMENTO: riesgos
    command: ["python", "-m", "app.engine.motor", "--interfaz", "br-riesgos"]

networks:
  ids-net:
    driver: bridge

volumes:
  mysql-data:
  clickhouse-data:
  elastic-data:
  models-data: