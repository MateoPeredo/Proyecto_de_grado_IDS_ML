services:
  # ── Frontend (React/Vite + Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: ./ids-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_WS_URL: /ws/live
    container_name: ids-frontend
    ports:
      - "8080:80"
    volumes:
      - ./ids-frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - ids-net

  # ── Backend (FastAPI + ML) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./ids-backend
      dockerfile: Dockerfile
    container_name: ids-backend
    expose:
      - "8000"            # solo visible dentro de la red de docker (Nginx hace proxy)
    # Variables del backend. El .env es opcional (no se versiona por seguridad);
    # si no existe, valen las de 'environment'. Para producción real, definí
    # JWT_SECRET en el .env y no lo subas al repo.
    env_file:
      - path: ./ids-backend/.env
        required: false
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ids
      MYSQL_PASSWORD: ids_pass
      MYSQL_DB: ids
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_DB: ids_metrics
      ELASTIC_HOST: http://elasticsearch:9200
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      clickhouse:
        condition: service_started
      elasticsearch:
        condition: service_started
    networks:
      - ids-net

  # ── MySQL (datos transaccionales: usuarios, reglas) ──────────────────────────
  mysql:
    image: mysql:8.4
    container_name: ids-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: ids
      MYSQL_USER: ids
      MYSQL_PASSWORD: ids_pass
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uids", "-pids_pass"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - ids-net

  # ── ClickHouse (series temporales para los gráficos) ─────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ids-clickhouse
    environment:
      CLICKHOUSE_USER: ids
      CLICKHOUSE_PASSWORD: ids_pass
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    restart: unless-stopped
    networks:
      - ids-net

  # ── Elasticsearch (logs, captura de tráfico, alertas) ────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ids-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"        # sin auth para entorno de desarrollo
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"       # límite de RAM para la JVM
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - ids-net

networks:
  ids-net:
    driver: bridge

volumes:
  mysql-data:
  clickhouse-data:
  elastic-data:
